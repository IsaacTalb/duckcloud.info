# Keep this legacy deployed Worker name unless the Cloudflare service is intentionally migrated.
name = 'duckcloud-info'
main = "src/index.ts"
compatibility_date = "2026-08-14"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "duckcloud"
database_id = "e49a5931-a942-49c6-a51c-bd632112b1eb"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "duckcloud-media"

[vars]
ALLOWED_ORIGINS = "https://duckcloud.info,https://www.duckcloud.info,http://localhost:3000"
R2_PUBLIC_BASE_URL = "https://assets.duckcloud.info"
